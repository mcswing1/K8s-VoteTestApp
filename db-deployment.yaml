apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  namespace: vote
  labels: 
    name: db-deployment
    app: demo-voting-app
spec:
  replicas: 1
  selector:
    matchLabels:
      name: db-app-pod
      app: demo-voting-app
  template:
    metadata:
      name: db-app-pod
      labels:
        name: db-app-pod
        app: demo-voting-app
    spec:
      containers:
        - name: db-app-pod
          image: postgres:9.4
          env: 
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          emptyDir: {}